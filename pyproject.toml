[project]
name = "moseq2-app"
dynamic = ["version"]
description = "Interactive data exploration tools for the MoSeq2 pipeline."
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    "bokeh>=2.4.2",
    "fastparquet>=0.4.1",
    "h5py>=2.10.0",
    "holoviews>=1.14.7",
    "ipython>=7.14.0",
    "ipywidgets>=7.5.1",
    "jinja2>=3.0.1",
    "joblib>=0.15.1",
    "jupyter-bokeh>=2.0.3",
    "jupyter>=1.0.0",
    "matplotlib>=3.1.2",
    "numpy>=1.18.3",
    "opencv-python>=4.1.2.30",
    "pandas>=1.0.5",
    "panel>=0.12.6",
    "plotly>=4.14.3",
    "qgridnext>=2.0.4",
    "ruamel.yaml>=0.16.5",
    "scikit-image>=0.16.2",
    "scikit-learn>=0.20.3",
    "scipy>=1.3.2",
    "seaborn>=0.11.0",
    "moseq2-extract>=1.4.0,<2",
    "moseq2-model>=1.4.0,<2",
    "moseq2-pca>=1.4.0,<2",
    "moseq2-viz>=1.4.0,<2",
    "Cython>=3.0.11",
    "requests>=2.32.3",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-regressions>=2.5.0",
    "pooch>=1.8.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "moseq2_app/__init__.py"

[tool.pdm]

[tool.pdm.build]
# pytest.ini carries xfail_strict, --strict-markers and the default
# deselection of the network tests. Without it the suite shipped in the
# sdist runs under different rules than the one the project runs.
source-includes = ["tests", "pytest.ini"]
