[project]
name = "moseq2-app"
dynamic = ["version"]
description = "Interactive data exploration tools for the MoSeq2 pipeline."
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    "bokeh>=3.9.2",
    "h5py>=3.16.0",
    "holoviews>=1.23.2",
    "ipython>=8.39.0",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "jupyter-bokeh>=4.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    "panel>=1.9.4",
    "plotly>=7.1.0",
    "qgridnext>=2.0.4",
    "ruamel.yaml>=0.19.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    # Exact pins, not floors. The five packages release together at one
    # version, and the notebooks carry a directory tree and a config file
    # between steps rather than a return value, so a mixed set is a
    # pipeline whose halves disagree about the files they hand each other.
    "moseq2-extract==1.4.5",
    "moseq2-model==1.4.5",
    "moseq2-pca==1.4.5",
    "moseq2-viz==1.4.5",
    "Cython>=3.3.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
tests = [
    # Each floor is the oldest version the CI suite has passed with.

    # The video tests write the files they read back. Nothing else in the
    # suite writes a video, so this is a test dependency rather than a
    # runtime one.
    "av>=17.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-regressions>=2.11.0",
    "pytest-timeout>=2.4.0",
    "pooch>=1.9.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "moseq2_app/__init__.py"

[tool.pdm]

[tool.pdm.build]
# pytest.ini carries xfail_strict, --strict-markers and the default
# deselection of the network tests. Without it the suite shipped in the
# sdist runs under different rules than the one the project runs.
source-includes = ["tests", "pytest.ini"]
