[project]
name = "moseq2-app"
version = "v1.3.1"
description = "Interactive data exploration tools for the MoSeq2 pipeline."
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
requires-python = "<3.13,>=3.9"
dependencies = [
    "bokeh>=2.4.2",
    "fastparquet>=0.4.1",
    "h5py>=2.10.0",
    "holoviews>=1.14.7",
    "ipython>=7.14.0",
    "ipywidgets>=7.5.1",
    "jinja2>=3.0.1",
    "joblib>=0.15.1",
    "jupyter-bokeh>=2.0.3",
    "jupyter>=1.0.0",
    "matplotlib>=3.1.2",
    "numpy>=1.18.3",
    "opencv-python>=4.1.2.30",
    "pandas>=1.0.5",
    "panel>=0.12.6",
    "plotly>=4.14.3",
    "qgridnext>=2.0.4",
    "ruamel.yaml>=0.16.5",
    "scikit-image>=0.16.2",
    "scikit-learn>=0.20.3",
    "scipy>=1.3.2",
    "seaborn>=0.11.0",
    "moseq2-extract @ file:///n/groups/datta/john/projects/user-support/2026-08-02-moseq2-modernization/source_worktrees/2026-08-27_extract_saunders/moseq2-extract",
    "moseq2-model @ file:///n/groups/datta/john/projects/user-support/2026-08-02-moseq2-modernization/source_worktrees/2026-08-06_backend_swap/moseq2-model",
    "moseq2-pca @ file:///n/groups/datta/john/projects/user-support/2026-08-02-moseq2-modernization/source_worktrees/2026-08-31_pca_saunders/moseq2-pca",
    "moseq2-viz @ file:///n/groups/datta/john/projects/user-support/2026-08-02-moseq2-modernization/source_worktrees/2026-08-07_viz_modernization/moseq2-viz",
    "Cython>=3.0.11",
    "requests>=2.32.3",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
