[tool.pdm.version]
source = "file"
path = "moseq2_viz/__init__.py"

[tool.pdm]

[project]
name = "moseq2-viz"
dynamic = ["version"]
description = "To boldly go where no mouse has gone before"
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The former ceiling of <3.8 came from the pinned dependencies below, none
# of which had a wheel past 3.7. Nothing in the source needs it.
#
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    # ffmpeg's own libraries, as a wheel. Crowd movies are written through
    # these rather than through an ffmpeg a user has to install themselves.
    "av>=17.1.0",
    "h5py>=3.16.0",
    # viz.py passes keepdims to scipy.stats.mode (added in 1.9) so the
    # result keeps the shape it had before the 1.11 default flip.
    "scipy>=1.15.3",
    # pointplot is called with linestyle (from 0.13), which replaced the
    # deprecated join.
    "seaborn>=0.13.2",
    "click>=8.5.0",
    "cytoolz>=1.2.0",
    "dtaidistance>=2.5.1",
    "joblib>=1.6.0",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.3.3",
    # Not imported directly; pandas needs it for the to_parquet path in
    # helpers/wrappers.py.
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
    # Imported by model/stat.py, and missing from this list until now, so a
    # clean install could not import moseq2_viz.model.stat.
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    # Exact pin, not a floor: moseq2-common releases with this package, at the
    # same version, from the same tag.
    "moseq2-common[video]==1.5.0",
]

[project.optional-dependencies]
# helpers/wrappers.py imports this lazily, behind a guarded try/except, only
# for graphviz transition-graph layouts. It needs system graphviz headers to
# build, so it stays opt-in.
graphviz = ["pygraphviz"]

[project.scripts]
moseq2-viz = "moseq2_viz.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
