[tool.pdm.version]
source = "file"
path = "moseq2_extract/__init__.py"

[tool.pdm]

[project]
name = "moseq2-extract"
dynamic = ["version"]
description = "To boldly go where no mouse has gone before"
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    # ffmpeg's own libraries, as a wheel. Video is read and written through
    # these rather than through an ffmpeg a user has to install themselves.
    "av>=17.1.0",
    "click>=8.5.0",
    "cytoolz>=1.2.0",
    "h5py>=3.16.0",
    # Only for reading a classifier saved before 2026: those are pickles,
    # and flip_classifier.py hands one to joblib rather than refusing it
    # outright. The classifiers this package downloads are pickle-free npz
    # archives read with numpy, and nothing here imports scikit-learn.
    "joblib>=1.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "ruamel.yaml>=0.19.1",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "tifffile>=2025.5.10",
    # Exact pin, not a floor: moseq2-common releases with this package, at the
    # same version, from the same tag.
    "moseq2-common[video]==1.5.0",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-click",
    "sphinx-rtd-theme",
]

[project.scripts]
moseq2-extract = "moseq2_extract.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
