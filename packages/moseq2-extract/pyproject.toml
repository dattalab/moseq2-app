[tool.pdm.version]
source = "file"
path = "moseq2_extract/__init__.py"

[tool.pdm]

[project]
name = "moseq2-extract"
dynamic = ["version"]
description = "To boldly go where no mouse has gone before"
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # ffmpeg's own libraries, as a wheel. Video is read and written through
    # these rather than through an ffmpeg a user has to install themselves.
    "av>=17.1",
    "click>=7.0",
    "cytoolz>=0.10.1",
    "h5py>=2.10.0",
    # Only for reading a classifier saved before 2026: those are pickles,
    # and flip_classifier.py hands one to joblib rather than refusing it
    # outright. The classifiers this package downloads are pickle-free npz
    # archives read with numpy, and nothing here imports scikit-learn.
    "joblib>=0.15.1",
    "matplotlib>=3.1.2",
    "numpy>=1.18.3",
    "opencv-python>=4.1.2.30",
    "ruamel.yaml>=0.16.5",
    "scikit-image>=0.16.2",
    "scipy>=1.3.2",
    "statsmodels>=0.10.2",
    "tqdm>=4.48.0",
    "tifffile>=2024.7.24",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-click",
    "sphinx-rtd-theme",
]

[project.scripts]
moseq2-extract = "moseq2_extract.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
