[tool.pdm.version]
source = "file"
path = "moseq2_model/__init__.py"

[tool.pdm]

[project]
name = "moseq2-model"
dynamic = ["version"]
description = "Modeling for the best"
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The former ceiling of <3.8 existed for the pyhsmm/pybasicbayes/
# autoregressive wheels, which are no longer dependencies.
#
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    # The model itself, including the robust AR-HMM work this package fits
    # through (robust x separate_trans, the robust evaluation surface,
    # stateseq_marginals and stateseq_mode), which first shipped in 0.3.5.
    "jax-moseq>=0.3.8",
    "jax>=0.6.2",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "h5py>=3.16.0",
    "click>=8.5.0",
    "joblib>=1.6.0",
    "cytoolz>=1.2.0",
    "tqdm>=4.70.1",
    "matplotlib>=3.10.9",
    # moseq2_model._yaml uses the YAML() interface; 0.18 removed the
    # module-level safe_load.
    "ruamel.yaml>=0.19.1",
    # Exact pin, not a floor: moseq2-common releases with this package, at the
    # same version, from the same tag.
    "moseq2-common==1.4.5",
]

[project.scripts]
moseq2-model = "moseq2_model.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
