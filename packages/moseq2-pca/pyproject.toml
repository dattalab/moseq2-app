[tool.pdm.version]
source = "file"
path = "moseq2_pca/__init__.py"

[tool.pdm]

[project]
name = "moseq2-pca"
dynamic = ["version"]
description = "To boldly go where no mouse has gone before"
readme = "README.md"
authors = [
    {name = "Jeff Markowitz"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The floor is 3.10 because jax-moseq declares it and keypoint-moseq
# depends on jax-moseq. There is no ceiling: what the upper bound should
# be is what the version matrix measures, and a ceiling here would refuse
# the columns that produce the answer.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    "bokeh>=3.9.2",
    "chest>=0.2.3",
    "click>=8.5.0",
    "dask-jobqueue>=0.9.0",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "h5py>=3.16.0",
    "joblib>=1.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
    "pathspec>=1.1.1",
    "psutil>=7.2.2",
    "ruamel.yaml>=0.19.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
moseq2-pca = "moseq2_pca.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
