[tool.pdm.version]
source = "file"
path = "moseq2_common/__init__.py"

[tool.pdm]

[project]
name = "moseq2-common"
dynamic = ["version"]
description = "Code shared by the MoSeq2 packages."
readme = "README.md"
authors = [
    {name = "Datta Lab"},
]
license = "LicenseRef-Harvard-Academic-Non-Commercial"
license-files = ["LICENSE.md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The same floor as the five packages that depend on it, and no ceiling, for
# the reasons their pyproject.toml files give.
requires-python = ">=3.10"
dependencies = [
    # Each floor is the oldest version the CI suite has passed with.

    "h5py>=3.16.0",
    "numpy>=2.2.6",
    "ruamel.yaml>=0.19.1",
]

[project.optional-dependencies]
# The video libraries moseq2_common.frames and moseq2_common.video need.
# moseq2-extract, moseq2-pca and moseq2-viz require this extra; moseq2-model
# does not.
video = [
    "av>=17.1.0",
    "matplotlib>=3.10.9",
    "opencv-python-headless>=5.0.0.93",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
