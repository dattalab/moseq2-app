name: tests

# The suite is the cross-platform equivalence check for the MoSeq2 pipeline.
# A run answers one question: does a user on this operating system, with this
# Python, get the same results as a user on any other?
#
# It lives in suite.yml, which all five repositories call, so this package
# reaches it the same way its siblings do. A pull request here passes its own
# head as the suite to run, so a change to the suite is run by the pull
# request that makes it, and may name sibling branches alongside it when the
# change spans two repositories.
#
# Pull requests test the oldest and newest supported Pythons on all three
# operating systems. The nightly run and manual runs test every supported
# Python and the tests that reach the network. Nothing reaches main except
# through a pull request, so a push to it has already been tested as one.

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly, including the tests that reach the network.
    - cron: "17 7 * * *"
  workflow_dispatch:

# A new push to a pull request cancels that pull request's earlier run. Other
# events each get their own group, so a nightly is never cancelled by
# something else arriving.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  suite:
    # The local path, so a pull request runs the suite as it changes it
    # rather than the one already on main.
    uses: ./.github/workflows/suite.yml
    with:
      app-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      pythons: ${{ github.event_name == 'pull_request' && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}
      network: ${{ github.event_name != 'pull_request' }}

  # The check the repository requires before merging. It passes only when the
  # suite passed, whichever Pythons this run chose to test. A matrix whose
  # size depends on the event cannot be named in a required check; this job
  # can.
  tests:
    name: tests
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - name: Require the suite to have passed
        run: test "${{ needs.suite.result }}" = success
