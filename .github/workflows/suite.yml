name: suite

# moseq2-app's suite is the test for all five packages: it walks both
# notebooks cell by cell, and every cell runs through the siblings. A sibling
# has no suite of its own, so it calls this one and gets its own checkout
# tested against the released rest of the pipeline.
#
# The install is the ordinary one, which brings the siblings from PyPI, and
# the checkouts under test are then laid over it. Everything around them is
# therefore what a user would have. A change spanning two repositories names
# both, so neither half waits on the other to be released.
#
# All five repositories reach the suite through here, including moseq2-app
# itself, so there is one description of what a run is and either side of a
# cross-repository change can name the other.

on:
  workflow_call:
    inputs:
      app-ref:
        description: >
          Which moseq2-app to run the suite from. A sibling leaves this at
          main and gets the released suite; moseq2-app's own pull requests
          pass their head, so a change to the suite is run by the pull
          request that makes it.
        type: string
        default: main
      overlays:
        description: >
          JSON array of {"repository": "owner/name", "ref": "sha-or-branch"}.
          Each is laid over the released pipeline in order, so a change
          spanning two repositories can be tested as one. Empty means the
          released pipeline exactly.
        type: string
        default: "[]"
      pythons:
        description: A JSON array of Python versions.
        type: string
        default: '["3.10", "3.14"]'
      network:
        description: >
          Also run the tests that reach a remote host. Those sit out of pull
          requests so a remote outage cannot redden one.
        type: boolean
        default: false

defaults:
  run:
    # Git Bash on the Windows runners, so every step below is one script.
    shell: bash

jobs:
  fixtures:
    name: fixtures / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dattalab/moseq2-app
          ref: ${{ inputs.app-ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate the fixture cache
        id: cache-dir
        run: |
          python -m pip install --quiet pooch
          python -c "import pooch; print('dir=' + str(pooch.os_cache('moseq2-app-tests')))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ steps.cache-dir.outputs.dir }}/*.tar.gz
          key: fixtures-${{ runner.os }}-${{ hashFiles('tests/fixture_registry.txt') }}

      - name: Fetch the bundles
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -c "import sys; sys.path.insert(0, 'tests'); import fixtures; fixtures.fetch_raw_sessions(); fixtures.fetch_analysis_bundle(); fixtures.fetch_azure_mkv()"

  suite:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    needs: fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ${{ fromJSON(inputs.pythons) }}
    steps:
      - name: Check out moseq2-app
        uses: actions/checkout@v4
        with:
          repository: dattalab/moseq2-app
          ref: ${{ inputs.app-ref }}

      # actions/checkout takes one repository, and a change that spans two
      # cannot be tested one half at a time: each half's pull request would
      # run against the other's released version, which does not have it yet.
      - name: Check out the overlays
        env:
          OVERLAYS: ${{ inputs.overlays }}
        run: |
          # jq writes its output through the Windows C runtime in text mode,
          # so every line it prints there ends CRLF. A ref carrying the
          # carriage return is not a ref git will fetch.
          printf '%s' "$OVERLAYS" |
            jq -r 'to_entries[] | "\(.key)\t\(.value.repository)\t\(.value.ref)"' |
            tr -d '\r' |
            while IFS="$(printf '\t')" read -r i repo ref; do
              # Fetching the ref by name covers a branch and a bare sha alike;
              # --branch would reject the sha a pull request actually passes.
              git clone --filter=blob:none --no-checkout "https://github.com/$repo" ".overlay-$i"
              git -C ".overlay-$i" fetch --depth 1 origin "$ref"
              git -C ".overlay-$i" checkout --quiet FETCH_HEAD
            done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac

      - name: Record the ffmpeg version
        run: ffmpeg -version | head -1

      - name: Locate the fixture cache
        id: cache-dir
        run: |
          python -m pip install --quiet pooch
          python -c "import pooch; print('dir=' + str(pooch.os_cache('moseq2-app-tests')))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache-dir.outputs.dir }}/*.tar.gz
          key: fixtures-${{ runner.os }}-${{ hashFiles('tests/fixture_registry.txt') }}

      - name: Install the pipeline as a user would
        run: python -m pip install ".[tests]"

      # Each overlay replaces the release that came from PyPI. --no-deps so an
      # overlay's own requirements cannot quietly move anything else, and in
      # array order so a later overlay wins over an earlier one.
      - name: Lay the overlays over it
        run: |
          for dir in $(ls -d .overlay-* 2>/dev/null | sort -V); do
            python -m pip install --no-deps --force-reinstall "./$dir"
          done

      - name: Record the resolution
        run: python -m pip freeze

      - name: Run the suite
        env:
          MPLBACKEND: Agg
        run: pytest -q

  # The flip-classifier cell downloads a trained classifier. Those tests sit
  # out of pull requests so a remote outage cannot redden one.
  network:
    name: network tests
    if: inputs.network
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dattalab/moseq2-app
          ref: ${{ inputs.app-ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Locate the fixture cache
        id: cache-dir
        run: |
          python -m pip install --quiet pooch
          python -c "import pooch; print('dir=' + str(pooch.os_cache('moseq2-app-tests')))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache-dir.outputs.dir }}/*.tar.gz
          key: fixtures-${{ runner.os }}-${{ hashFiles('tests/fixture_registry.txt') }}

      - name: Install the package as a user would
        run: python -m pip install ".[tests]"

      - name: Run the tests that reach the network
        env:
          MPLBACKEND: Agg
        run: pytest -q -m network
