name: release

# Publishing a GitHub release builds all six packages from the release tag
# and uploads them to PyPI over trusted publishing, so no API token is stored
# anywhere, then attaches to the release the versions its CI run passed with.
# Running the workflow by hand instead checks that the publisher is
# registered, by making the same exchange and stopping at the answer.
#
# PyPI scopes a trusted publisher to one repository and one workflow file, by
# name, and every PyPI project this workflow uploads names this repository and
# this file. It has to keep the name the publisher was registered with, and the
# upload has to run from this file, or the exchange is refused however correct
# the rest of the registration is. A project new to PyPI needs a pending
# publisher registered under the same names before its first upload.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Only ever runs by hand. Proves the registration without publishing.
  verify:
    name: trusted publisher
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ask PyPI for a token
        run: |
          set -euo pipefail

          audience=$(curl -fsS https://pypi.org/_/oidc/audience \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])')

          # The runner mints the OIDC token; it is never printed.
          id_token=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$id_token\"}")

          if [ "$status" = "200" ]; then
            echo "PyPI accepted the exchange. The trusted publisher is registered"
            echo "for this repository and this workflow file."
            exit 0
          fi

          echo "PyPI refused the exchange (HTTP $status). What it said:"
          # The refusal carries no token, only the reason.
          python3 -c 'import json;print(json.dumps(json.load(open("response.json")),indent=2))' \
            || cat response.json
          exit 1

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the checker's dependencies
        run: python -m pip install --quiet packaging

      # Refuses a tag that any package, moseq2-app's pins or a notebook
      # disagrees with.
      - name: Check the release against its tag
        run: python .github/scripts/check_release.py "${{ github.event.release.tag_name }}"

      # All six are built before any is uploaded, so one that fails to build
      # publishes nothing.
      - name: Build
        run: |
          pipx run build --outdir dist/common packages/moseq2-common
          for dir in packages/*/; do
            if [ "$dir" != packages/moseq2-common/ ]; then
              pipx run build --outdir dist/siblings "$dir"
            fi
          done
          pipx run build --outdir dist/app .

      # The other five each require moseq2-common at exactly this version, so
      # it goes up first, and moseq2-app, which pins the other five, goes up
      # last: whatever fails, nothing on PyPI requires a release that is not
      # there. skip-existing lets a rerun after a partial upload finish the rest.
      - name: Publish moseq2-common
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/common/
          skip-existing: true

      - name: Publish the four packages moseq2-app drives
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/siblings/
          skip-existing: true

      - name: Publish moseq2-app
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/app/
          skip-existing: true

      # An upload returns before the index installers read has caught up.
      - name: Wait for the index
        run: |
          version=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          for name in moseq2-common moseq2-extract moseq2-pca moseq2-model moseq2-viz moseq2-app; do
            python .github/scripts/await_index.py "$name" "$version"
          done

  # The release branch names the newest version a user can install. pip does
  # not install a pre-release by default, so one leaves the branch where it is.
  release-branch:
    name: move the release branch
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Is this a final release?
        id: final
        run: python .github/scripts/is_final_release.py "${{ github.event.release.tag_name }}" | tee -a "$GITHUB_OUTPUT"

      - name: Move it
        if: steps.final.outputs.final == 'true'
        run: git push origin HEAD:refs/heads/release

  # The versions this release passed CI with, one pip constraints file per
  # operating system and Python, so a user whose fresh install breaks after an
  # upstream release can run
  #   python -m pip install moseq2-app==<version> -c <file>
  # The release is the merge of the release pull request into main, so the
  # merge commit's second parent is that pull request's head, and its tests
  # run is the one that tested every supported Python on every operating
  # system and saved a constraints file from each suite job.
  constraints:
    name: attach the tested versions
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Find the release pull request's tests run
        id: run
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.parents[1].sha // empty')
          if [ -z "$head" ]; then
            echo "::error::$TAG does not point at a merge commit, so there is no release pull request whose tests run to take the constraints files from. Attach them by hand: gh run download <run id> --pattern 'constraints-*', then gh release upload $TAG <files>."
            exit 1
          fi
          run=$(gh run list --workflow tests --event pull_request --commit "$head" \
            --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful pull-request run of the tests workflow at $head, the head of the pull request $TAG merged. Re-run that pull request's tests run from the Actions tab (a merged pull request's run can still be re-run), then re-run this job."
            exit 1
          fi
          echo "Taking the constraints files from $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run (tests at $head)"
          echo "id=$run" >> "$GITHUB_OUTPUT"

      - name: Attach its constraints files to the release
        run: |
          set -euo pipefail
          run=${{ steps.run.outputs.id }}
          if ! gh run download "$run" --pattern 'constraints-*' --dir constraints; then
            echo "::error::Run $run has no constraints files to download: it predates the step in tests.yml that writes them, or its artifacts have expired. This release gets no constraints files; attach any you have by hand with gh release upload $TAG <files>."
            exit 1
          fi
          files=(constraints/*/constraints-*.txt)
          # Five Pythons on three operating systems. Fewer means the pull
          # request ran the two-Python matrix, which happens when its branch
          # name does not start with "release".
          if [ ${#files[@]} -ne 15 ]; then
            echo "::warning::Run $run kept ${#files[@]} constraints files, not 15 (five Pythons on three operating systems): ${files[*]##*/}. Users on the missing Pythons have no file for $TAG. A release pull request's branch name has to start with \"release\" for it to test every Python."
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Attached to $TAG:"
          printf '  %s\n' "${files[@]##*/}"
