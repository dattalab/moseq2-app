[pytest]
testpaths =
    tests/
log_cli = true
log_level = INFO
xfail_strict = true
# A test that hangs is reported as a hang, with the stack of wherever it
# stopped, rather than as a runner killing the job some ninety minutes later
# with nothing to show for it. The whole suite runs in under ten minutes, so
# nothing legitimate comes near this. The thread method works on every
# operating system and reaches a hang inside C code, which the signal method
# cannot interrupt. It needs the GIL to print, so a hang that holds the GIL
# is caught by faulthandler a minute later instead: it prints every thread's
# stack without the GIL, though it cannot end the run.
timeout = 600
timeout_method = thread
faulthandler_timeout = 660
addopts =
    --strict-markers
    --strict-config
    -m "not network"
markers =
    network: reaches a remote host, so a remote outage would redden a pull request. Deselected by default; the nightly job runs these with `-m network`.
